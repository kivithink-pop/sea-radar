name: 每日信息采集

on:
  schedule:
    # 每天 UTC 0:00 / 北京时间 8:00 跑（可调整）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 运行采集
        run: python scripts/collect_rss.py
        env:
          HOURS_LOOKBACK: '48'
          MAX_PER_SOURCE: '20'

      - name: 提交并推送数据
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日自动采集 $(date -u +'%Y-%m-%d')"
          git push
